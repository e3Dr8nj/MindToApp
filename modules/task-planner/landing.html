<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Планировщик дел — организуй хаос. Темы, градиенты и абсолютная польза.">
<title>Планировщик дел — организуй хаос</title>
<style>
  :root{
    --bg:#070712; --card:rgba(255,255,255,.05); --stroke:rgba(255,255,255,.12);
    --txt:#ecedf7; --muted:#9a9ab8;
    --g1:#8b7bff; --g2:#ff7a59; --g3:#ffb347; --ok:#3ecf8e;
    --grad:linear-gradient(135deg,#8b7bff 0%,#ff7a59 60%,#ffb347 100%);
    --grad-shadow:rgba(139,123,255,.45);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:calc(100vh - 60px); background:var(--bg); color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden; line-height:1.55;
  }
  #fx{position:fixed; inset:0; z-index:0; pointer-events:none}
  .aurora{position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(70px); opacity:.55;
    background:
      radial-gradient(38% 34% at 18% 22%, rgba(139,123,255,.34), transparent 60%),
      radial-gradient(30% 30% at 82% 18%, rgba(255,122,89,.26), transparent 60%),
      radial-gradient(36% 40% at 60% 86%, rgba(255,179,71,.18), transparent 60%);
    animation:aurora 16s ease-in-out infinite alternate;
  }
  @keyframes aurora{
    0%{transform:translate3d(-2%,-1%,0) scale(1)}
    50%{transform:translate3d(2%,2%,0) scale(1.06)}
    100%{transform:translate3d(-1%,2%,0) scale(1.02)}
  }
  #cursorGlow{position:fixed; left:0; top:0; width:520px; height:520px; margin:-260px 0 0 -260px;
    z-index:1; pointer-events:none; border-radius:50%;
    background:radial-gradient(circle, rgba(139,123,255,.16), rgba(255,122,89,.06) 45%, transparent 70%);
    will-change:transform;
  }
  main,header.topbar,footer{position:relative; z-index:2}

  header.topbar{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 18px; background:rgba(7,7,18,.6);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--stroke);
  }
  .logo{display:flex; align-items:center; gap:8px; font-weight:900; font-size:17px; letter-spacing:-.02em}
  .logo b{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
  .top-actions{display:flex; align-items:center; gap:8px}
  .lang-btn{
    min-width:44px; padding:9px 12px; border-radius:999px; cursor:pointer;
    border:1px solid var(--stroke); background:var(--card); color:var(--txt);
    font-weight:800; font-size:12px; letter-spacing:.06em; transition:.2s;
  }
  .lang-btn:hover{border-color:var(--g1); box-shadow:0 0 0 3px rgba(139,123,255,.18)}

  .hero{min-height:96vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:120px 18px 40px}
  .hero-badge{
    display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px;
    border:1px solid rgba(139,123,255,.5); background:rgba(139,123,255,.12);
    color:#cbb9ff; font-size:12.5px; font-weight:700; letter-spacing:.04em; margin-bottom:22px;
    animation:badgeFloat 4s ease-in-out infinite;
  }
  @keyframes badgeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  h1{margin:0 0 18px; font-size:clamp(40px,8vw,86px); font-weight:900; letter-spacing:-.035em; line-height:1.04}
  .shimmer{
    background:linear-gradient(90deg,#ffd88a,#ff8f6b 30%,#a08cff 55%,#ffd88a 85%);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .hero-sub{max-width:660px; color:var(--muted); font-size:clamp(15px,2.6vw,19px); margin:0 auto 30px}

  .mock-wrap{perspective:1100px}
  .mock{
    width:min(430px,92vw); background:rgba(255,255,255,.055); border:1px solid var(--stroke);
    border-radius:24px; padding:18px; text-align:left;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    animation:float 7s ease-in-out infinite; transform-style:preserve-3d; will-change:transform;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotateX(4deg) rotateY(-6deg)}50%{transform:translateY(-16px) rotateX(2deg) rotateY(-2deg)}}
  .mock-bar{display:flex; gap:6px; margin-bottom:14px}
  .mock-bar i{width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.18)}
  .mock-bar i:first-child{background:#ff5a7a}.mock-bar i:nth-child(2){background:#ffb347}.mock-bar i:nth-child(3){background:#3ecf8e}
  .mock-row{display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); margin-top:8px; border-left:4px solid var(--g1)}
  .mock-row.c2{border-left-color:var(--g2)}.mock-row.c3{border-left-color:var(--g3)}
  .mk-check{flex:none; width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent}
  .mk-check.on{background:linear-gradient(135deg,#3ecf8e,#2fa866); border-color:transparent; color:#fff;
    animation:pop 2.6s ease-in-out infinite}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  .sk{display:block; height:10px; border-radius:6px; background:rgba(255,255,255,.14)}
  .w60{width:60%}.w80{width:80%}.w45{width:45%}
  .mock-prog{height:10px; border-radius:99px; background:rgba(255,255,255,.08); margin-top:14px; overflow:hidden}
  .mock-prog i{display:block; height:100%; border-radius:99px; background:var(--grad);
    animation:bar 4s ease-in-out infinite alternate}
  @keyframes bar{0%{width:22%}100%{width:86%}}
  .mock-btns{display:flex; gap:8px; margin-top:14px}
  .mb{height:34px; border-radius:10px; flex:1}
  .mb.g1{background:var(--grad)}
  .mb.g2{background:rgba(255,255,255,.08); border:1px solid var(--stroke)}

  .ticker{overflow:hidden; border-top:1px solid var(--stroke); border-bottom:1px solid var(--stroke);
    background:rgba(255,255,255,.03); padding:12px 0; margin:20px 0 0}
  .ticker-track{display:flex; gap:44px; width:max-content; animation:tick 34s linear infinite; will-change:transform}
  .ticker-track span{white-space:nowrap; color:var(--muted); font-size:14px; font-weight:600}
  @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  section{max-width:1080px; margin:0 auto; padding:70px 18px}
  h2{font-size:clamp(26px,5vw,44px); font-weight:900; letter-spacing:-.03em; margin:0 0 14px; text-align:center}
  h2 .shimmer{background-size:300% 100%}
  .sec-sub{text-align:center; color:var(--muted); margin:0 auto 40px; max-width:640px}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
  .stat{background:var(--card); border:1px solid var(--stroke); border-radius:20px; padding:22px 14px; text-align:center;
    transition:transform .25s ease, border-color .25s ease}
  .stat:hover{transform:translateY(-6px); border-color:rgba(139,123,255,.6)}
  .stat b{display:block; font-size:clamp(26px,4.6vw,42px); font-weight:900;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px; color:var(--muted)}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px}
  .fcard{background:var(--card); border:1px solid var(--stroke); border-radius:22px; padding:26px 22px;
    transition:border-color .25s ease, box-shadow .25s ease; will-change:transform}
  .fcard:hover{border-color:rgba(255,122,89,.55); box-shadow:0 18px 44px rgba(0,0,0,.45)}
  .fcard .em{font-size:38px; display:block; margin-bottom:12px; filter:drop-shadow(0 6px 14px rgba(139,123,255,.45))}
  .fcard h3{margin:0 0 8px; font-size:18px; font-weight:800}
  .fcard p{margin:0; color:var(--muted); font-size:14px}

  .science{background:var(--card); border:1px dashed rgba(139,123,255,.55); border-radius:26px; padding:34px 26px}
  .science ul{list-style:none; margin:22px 0 14px; padding:0; display:flex; flex-direction:column; gap:14px}
  .science li{display:flex; gap:12px; align-items:flex-start; font-size:16px}
  .science li .ok{flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#3ecf8e,#2fa866); font-size:14px; box-shadow:0 6px 16px rgba(47,168,102,.4)}
  .science .note{color:var(--muted); font-size:12.5px; font-style:italic; margin:0}

  .qcard{background:var(--card); border:1px solid var(--stroke); border-radius:22px; padding:26px 22px; position:relative;
    transition:transform .25s ease, border-color .25s ease}
  .qcard:hover{transform:translateY(-6px) rotate(-.4deg); border-color:rgba(255,179,71,.5)}
  .qcard .ava{font-size:44px; display:block; margin-bottom:10px}
  .qcard p{margin:0 0 16px; font-size:15px}
  .qcard .who b{display:block; font-size:14px}
  .qcard .who span{font-size:12px; color:var(--muted)}
  .qcard .qm{position:absolute; top:14px; right:18px; font-size:44px; color:rgba(139,123,255,.25); font-weight:900}

  .final{text-align:center; padding-bottom:90px}

  footer{border-top:1px solid var(--stroke); padding:34px 18px 44px; text-align:center; color:var(--muted); font-size:13px}

  .reveal{opacity:0; transform:translateY(30px); transition:opacity .8s ease, transform .8s ease}
  .reveal.in{opacity:1; transform:translateY(0)}

  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(30px);
    background:var(--grad); color:#fff; padding:12px 22px; border-radius:14px; font-weight:700; font-size:14px;
    opacity:0; pointer-events:none; transition:.3s; z-index:90; box-shadow:0 10px 30px var(--grad-shadow);
    max-width:92vw; text-align:center}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media(max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:104px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="aurora"></div>
<div id="cursorGlow"></div>

<header class="topbar">
  <div class="logo">🗓️ <b data-i18n="navLogo"></b></div>
  <div class="top-actions">
    <button id="langBtn" class="lang-btn" title="Language">EN</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-badge reveal">✨ <span data-i18n="badge"></span></div>
    <h1 class="reveal"><span class="shimmer" data-i18n="h1"></span></h1>
    <p class="hero-sub reveal" data-i18n="sub"></p>
    <div class="mock-wrap reveal">
      <div class="mock tilt">
        <div class="mock-bar"><i></i><i></i><i></i></div>
        <div class="mock-row c1"><span class="mk-check on">✓</span><span class="sk w60"></span></div>
        <div class="mock-row c2"><span class="mk-check"></span><span class="sk w80"></span></div>
        <div class="mock-row c3"><span class="mk-check"></span><span class="sk w45"></span></div>
        <div class="mock-prog"><i></i></div>
        <div class="mock-btns"><span class="mb g1"></span><span class="mb g2"></span></div>
      </div>
    </div>
  </section>

  <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

  <section id="statsSec">
    <h2 class="reveal"><span class="shimmer" data-i18n="statsTitle"></span></h2>
    <div class="stats reveal">
      <div class="stat"><b data-count="10000000">0</b><span data-i18n="s1"></span></div>
      <div class="stat"><b data-count="4">0</b><span data-i18n="s2"></span></div>
      <div class="stat"><b data-count="100">0</b><span data-i18n="s3"></span></div>
      <div class="stat"><b data-count="0">0</b><span data-i18n="s4"></span></div>
    </div>
  </section>

  <section>
    <h2 class="reveal"><span class="shimmer" data-i18n="featTitle"></span></h2>
    <div class="grid">
      <div class="fcard tilt reveal"><span class="em">📅</span><h3 data-i18n="f1t"></h3><p data-i18n="f1p"></p></div>
      <div class="fcard tilt reveal"><span class="em">🌗</span><h3 data-i18n="f2t"></h3><p data-i18n="f2p"></p></div>
      <div class="fcard tilt reveal"><span class="em">🎨</span><h3 data-i18n="f3t"></h3><p data-i18n="f3p"></p></div>
      <div class="fcard tilt reveal"><span class="em">💾</span><h3 data-i18n="f4t"></h3><p data-i18n="f4p"></p></div>
      <div class="fcard tilt reveal"><span class="em">📤</span><h3 data-i18n="f5t"></h3><p data-i18n="f5p"></p></div>
      <div class="fcard tilt reveal"><span class="em">🚫</span><h3 data-i18n="f6t"></h3><p data-i18n="f6p"></p></div>
    </div>
  </section>

  <section>
    <div class="science reveal">
      <h2 style="margin-bottom:0"><span class="shimmer" data-i18n="sciTitle"></span></h2>
      <ul>
        <li><span class="ok">✓</span><span data-i18n="sci1"></span></li>
        <li><span class="ok">✓</span><span data-i18n="sci2"></span></li>
        <li><span class="ok">✓</span><span data-i18n="sci3"></span></li>
      </ul>
      <p class="note" data-i18n="sciNote"></p>
    </div>
  </section>

  <section>
    <h2 class="reveal"><span class="shimmer" data-i18n="qTitle"></span></h2>
    <div class="grid">
      <div class="qcard tilt reveal"><span class="qm">"</span><span class="ava">🐹</span>
        <p data-i18n="q1"></p><div class="who"><b data-i18n="q1a"></b><span data-i18n="q1r"></span></div></div>
      <div class="qcard tilt reveal"><span class="qm">"</span><span class="ava">🐈</span>
        <p data-i18n="q2"></p><div class="who"><b data-i18n="q2a"></b><span data-i18n="q2r"></span></div></div>
      <div class="qcard tilt reveal"><span class="qm">"</span><span class="ava">🎖️</span>
        <p data-i18n="q3"></p><div class="who"><b data-i18n="q3a"></b><span data-i18n="q3r"></span></div></div>
    </div>
  </section>

  <section class="final reveal">
    <h2><span class="shimmer" data-i18n="finalH"></span></h2>
    <p class="sec-sub" style="margin-bottom:0" data-i18n="finalP"></p>
  </section>
</main>

<footer><span data-i18n="footer"></span></footer>
<div id="toast"></div>

      q1:'Hid 40 tasks in my cheeks. Not a single one lost. Keeping the bar high.',
      q1a:'Hamster Zyuma', q1r:'professional hoarder',
      q2:'I don’t use planners. But I sat on the keyboard and created «Feed me». Done in 4 seconds. The service works.',
      q2a:'Cat Barsik', q2r:'lying-down manager',
      q3:'Had I owned this planner, I wouldn’t have been late to Waterloo. Though… I would have. But stylishly!',
      q3a:'Napoleon', q3r:'reincarnation, 3rd attempt',
      finalH:'Welcome to the next level of productivity',
      finalP:'The tasks are already nervous. The hamsters are preparing disappointed looks. Open the app in MindToApp platform.',
      footer:'Made with ❤️ and a light touch of absurdity. No hamsters were harmed. A few missed their deadlines.',
      langToast:'🌐 Language: English'
    }
  };

  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const safeGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const safeSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

  let lang = safeGet(LS_LANG);
  if (lang !== 'ru' && lang !== 'en') {
    lang = ((navigator.language||'').toLowerCase().indexOf('ru') === 0) ? 'ru' : 'en';
  }
  const t = k => (I18N[lang] && I18N[lang][k]) || I18N.ru[k] || k;

  function toast(msg){
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>el.classList.remove('show'), 2600);
  }

  function buildTicker(){
    const items = t('ticker');
    const html = items.map(s => '<span>' + s + '</span>').join('');
    $('#tickerTrack').innerHTML = html + html;
  }

  function applyLang(){
    document.documentElement.lang = lang;
    document.title = lang === 'ru' ? 'Планировщик дел — организуй хаос' : 'Task Planner — organize the chaos';
    $$('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      el.innerHTML = t(k);
    });
    $('#langBtn').textContent = lang === 'ru' ? 'EN' : 'RU';
    buildTicker();
  }

  $('#langBtn').addEventListener('click', () => {
    lang = lang === 'ru' ? 'en' : 'ru';
    safeSet(LS_LANG, lang);
    applyLang();
    toast(t('langToast'));
  });

  const canvas = $('#fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dots = [];
  let mx = 0, my = 0, cmx = 0, cmy = 0;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function initDots(){
    dots = [];
    const n = Math.min(90, Math.floor(W*H/16000));
    for (let i = 0; i < n; i++){
      dots.push({
        x: Math.random()*W, y: Math.random()*H,
        r: .8 + Math.random()*2.2,
        vx: (Math.random()-.5)*.25, vy: (Math.random()-.5)*.25,
        h: Math.random() < .5 ? 250 : 20,
        a: .25 + Math.random()*.4,
        d: .4 + Math.random()*1.2
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    cmx += (mx - cmx) * .04;
    cmy += (my - cmy) * .04;
    for (const p of dots){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W+10; if (p.x > W+10) p.x = -10;
      if (p.y < -10) p.y = H+10; if (p.y > H+10) p.y = -10;
      const ox = cmx * 22 * p.d, oy = cmy * 16 * p.d;
      ctx.beginPath();
      ctx.arc(p.x + ox, p.y + oy, p.r, 0, 6.2832);
      ctx.fillStyle = 'hsla(' + p.h + ',90%,70%,' + p.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  if (!RM){
    resize(); initDots(); tick();
    window.addEventListener('resize', () => { resize(); initDots(); });
    window.addEventListener('mousemove', e => {
      mx = (e.clientX / W - .5) * 2;
      my = (e.clientY / H - .5) * 2;
      glow.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
    });
  } else {
    canvas.style.display = 'none';
    $('#cursorGlow').style.display = 'none';
  }
  const glow = $('#cursorGlow');

  if (!RM){
    $$('.tilt').forEach(el => {
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - .5;
        const py = (e.clientY - r.top) / r.height - .5;
        el.style.transform = 'perspective(900px) rotateY(' + (px*8) + 'deg) rotateX(' + (-py*8) + 'deg) translateY(-4px)';
      });
      el.addEventListener('mouseleave', () => { el.style.transform = ''; });
    });
  }

  let counted = false;
  function runCounters(){
    if (counted) return; counted = true;
    $$('[data-count]').forEach(el => {
      const target = parseInt(el.getAttribute('data-count'), 10) || 0;
      const t0 = performance.now();
      const dur = 1500;
      function step(now){
        const k = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);
        const val = Math.round(target * e);
        el.textContent = val.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US');
        if (k < 1) requestAnimationFrame(step);
      }
      if (RM) { el.textContent = target.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US'); }
      else requestAnimationFrame(step);
    });
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        en.target.classList.add('in');
        if (en.target.id === 'statsSec' || en.target.querySelector && en.target.querySelector('[data-count]')) runCounters();
        io.unobserve(en.target);
      }
    });
  }, { threshold: .15 });
  $$('.reveal').forEach(el => io.observe(el));
  io.observe($('#statsSec'));

  applyLang();
})();
</script>
</body>
</html>
