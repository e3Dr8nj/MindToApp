<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Блокнот</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Мои заметки</h1>
      <div class="actions">
        <button id="new-note-btn" class="btn btn-primary">+ Новая заметка</button>
        <button id="export-btn" class="btn">📥 Экспорт</button>
      </div>
    </header>
    
    <div class="notes-list" id="notes-list">
      <!-- Список заметок -->
    </div>
    
    <div class="editor" id="editor" style="display: none;">
      <div class="editor-header">
        <input type="text" id="note-title" placeholder="Заголовок заметки" class="title-input">
        <button id="close-editor-btn" class="btn">✕ Закрыть</button>
      </div>
      <textarea id="note-content" placeholder="Начните писать..." class="content-input"></textarea>
      <div class="editor-footer">
        <span id="save-status">Автосохранение включено</span>
        <button id="delete-note-btn" class="btn btn-danger">🗑 Удалить</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
