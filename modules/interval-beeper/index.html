<body>
  <div class="container">
    <h1>🔔 Звуковой таймер</h1>
    <p class="subtitle">Повторяющийся сигнал через заданный интервал</p>
    
    <div class="interval-label">Интервал между сигналами:</div>
    <div class="interval-selector">
      <button class="interval-btn active" data-interval="2">2 сек</button>
      <button class="interval-btn" data-interval="4">4 сек</button>
      <button class="interval-btn" data-interval="6">6 сек</button>
    </div>
    
    <div class="status stopped" id="status">
      <span>⏸ Остановлен</span>
    </div>
    
    <div class="controls">
      <button class="btn btn-start" id="start-btn">▶ Старт</button>
      <button class="btn btn-stop" id="stop-btn" disabled>⏹ Стоп</button>
    </div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="beep-count">0</div>
        <div class="stat-label">Сигналов</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="elapsed-time">0:00</div>
        <div class="stat-label">Время работы</div>
      </div>
    </div>
    
    <div class="info">
      💡 Работает в фоновом режиме. Звук воспроизводится через Web Audio API — не замедляется при сворачивании вкладки.
    </div>
  </div>
  
  <script>
    // Состояние
    let audioContext = null;
    let interval = parseInt(localStorage.getItem('beeperInterval') || '2');
    let isRunning = false;
    let beepCount = parseInt(localStorage.getItem('beeperCount') || '0');
    let startTime = null;
    let timerInterval = null;
    let scheduleTimeout = null;
    let nextBeepTime = 0;
    const SCHEDULE_AHEAD = 5; // планируем звуки на 5 секунд вперёд
    const LOOKAHEAD_MS = 250; // проверяем расписание каждые 250мс
    
    // DOM
    const body = document.body;
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const beepCountEl = document.getElementById('beep-count');
    const elapsedTimeEl = document.getElementById('elapsed-time');
    const intervalBtns = document.querySelectorAll('.interval-btn');
    
    // Инициализация
    beepCountEl.textContent = beepCount;
    setActiveIntervalBtn();
    
    function setActiveIntervalBtn() {
      intervalBtns.forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.interval) === interval);
      });
    }
    
    // Инициализация AudioContext (только после взаимодействия пользователя)
    function initAudio() {
      if (!audioContext) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.error('Web Audio API не поддерживается:', e);
          alert('Ваш браузер не поддерживает Web Audio API');
          return false;
        }
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return true;
    }
    
    // Воспроизведение звука (короткий бип)
    function playBeep(time) {
      if (!audioContext) return;
      
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      osc.type = 'sine';
      osc.frequency.value = 880;
      
      // Envelope чтобы не было щелчка
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.5, time + 0.01);
      gain.gain.linearRampToValueAtTime(0, time + 0.15);
      
      osc.start(time);
      osc.stop(time + 0.2);
      
      // Визуальная индикация — синхронизируем с реальным временем звука
      const delayMs = Math.max(0, (time - audioContext.currentTime) * 1000);
      setTimeout(() => {
        body.classList.add('beep');
        beepCount++;
        localStorage.setItem('beeperCount', beepCount);
        beepCountEl.textContent = beepCount;
        setTimeout(() => body.classList.remove('beep'), 150);
      }, delayMs);
    }
    
    // Планировщик — добавляет звуки вперёд по расписанию
    function scheduler() {
      if (!isRunning || !audioContext) return;
      
      while (nextBeepTime < audioContext.currentTime + SCHEDULE_AHEAD) {
        playBeep(nextBeepTime);
        nextBeepTime += interval;
      }
      
      scheduleTimeout = setTimeout(scheduler, LOOKAHEAD_MS);
    }
    
    // Старт
    function start() {
      if (!initAudio()) return;
      
      isRunning = true;
      startTime = audioContext.currentTime;
      nextBeepTime = audioContext.currentTime + 0.1;
      
      statusEl.className = 'status running';
      statusEl.innerHTML = '<span class="pulse-dot"></span><span>Работает (каждые ' + interval + ' сек)</span>';
      
      startBtn.disabled = true;
      stopBtn.disabled = false;
      intervalBtns.forEach(btn => btn.disabled = true);
      
      // Таймер для отображения прошедшего времени
      timerInterval = setInterval(updateElapsedTime, 1000);
      
      // Запуск планировщика
      scheduler();
    }
    
    // Стоп
    function stop() {
      isRunning = false;
      
      if (scheduleTimeout) {
        clearTimeout(scheduleTimeout);
        scheduleTimeout = null;
      }
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      statusEl.className = 'status stopped';
      statusEl.innerHTML = '<span>⏸ Остановлен</span>';
      
      startBtn.disabled = false;
      stopBtn.disabled = true;
      intervalBtns.forEach(btn => btn.disabled = false);
    }
    
    // Обновление времени
    function updateElapsedTime() {
      if (!startTime || !audioContext) return;
      const elapsed = Math.floor(audioContext.currentTime - startTime);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      elapsedTimeEl.textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;
    }
    
    // Обработчики
    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
    
    intervalBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRunning) return;
        interval = parseInt(btn.dataset.interval);
        localStorage.setItem('beeperInterval', interval);
        setActiveIntervalBtn();
      });
    });
    
    // Сброс счётчика по двойному клику
    beepCountEl.parentElement.addEventListener('dblclick', () => {
      if (isRunning) return;
      if (confirm('Сбросить счётчик сигналов?')) {
        beepCount = 0;
        localStorage.setItem('beeperCount', 0);
        beepCountEl.textContent = 0;
      }
    });
    
    // Очистка при закрытии
    window.addEventListener('beforeunload', () => {
      if (isRunning) stop();
    });
  </script>
</body>
</html>
