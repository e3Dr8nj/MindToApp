<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  
  <script type="application/json" id="manifest">
  {
    "id": "calculator",
    "name": "Калькулятор",
    "icon": "🧮",
    "description": "Быстрые математические вычисления"
  }
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .calculator {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 350px;
      width: 100%;
    }
    
    .display {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    
    .display-expression {
      font-size: 16px;
      color: #999;
      margin-bottom: 10px;
      min-height: 20px;
      word-wrap: break-word;
    }
    
    .display-result {
      font-size: 42px;
      font-weight: bold;
      color: #333;
      word-wrap: break-word;
    }
    
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    
    .btn {
      padding: 20px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: #e0e0e0;
      color: #333;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-number {
      background: #f5f5f5;
    }
    
    .btn-number:hover {
      background: #e8e8e8;
    }
    
    .btn-operator {
      background: #667eea;
      color: white;
    }
    
    .btn-operator:hover {
      background: #5568d3;
    }
    
    .btn-function {
      background: #ff6b6b;
      color: white;
    }
    
    .btn-function:hover {
      background: #ff5252;
    }
    
    .btn-equals {
      background: #4CAF50;
      color: white;
      grid-column: span 2;
    }
    
    .btn-equals:hover {
      background: #45a049;
    }
    
    .btn-zero {
      grid-column: span 2;
    }
    
    @media (max-width: 400px) {
      .btn {
        padding: 15px;
        font-size: 18px;
      }
      
      .display-result {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="display-expression" id="expression"></div>
      <div class="display-result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn btn-function" data-action="clear">C</button>
      <button class="btn btn-function" data-action="backspace">⌫</button>
      <button class="btn btn-operator" data-action="operator" data-value="%">%</button>
      <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>
      
      <button class="btn btn-number" data-action="number" data-value="7">7</button>
      <button class="btn btn-number" data-action="number" data-value="8">8</button>
      <button class="btn btn-number" data-action="number" data-value="9">9</button>
      <button class="btn btn-operator" data-action="operator" data-value="*">×</button>
      
      <button class="btn btn-number" data-action="number" data-value="4">4</button>
      <button class="btn btn-number" data-action="number" data-value="5">5</button>
      <button class="btn btn-number" data-action="number" data-value="6">6</button>
      <button class="btn btn-operator" data-action="operator" data-value="-">−</button>
      
      <button class="btn btn-number" data-action="number" data-value="1">1</button>
      <button class="btn btn-number" data-action="number" data-value="2">2</button>
      <button class="btn btn-number" data-action="number" data-value="3">3</button>
      <button class="btn btn-operator" data-action="operator" data-value="+">+</button>
      
      <button class="btn btn-number btn-zero" data-action="number" data-value="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-equals" data-action="calculate">=</button>
    </div>
  </div>
  
  <script>
    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let shouldResetDisplay = false;
    
    const displayResult = document.getElementById('result');
    const displayExpression = document.getElementById('expression');
    const buttons = document.querySelectorAll('.btn');
    
    updateDisplay();
    
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;
        
        switch (action) {
          case 'number':
            handleNumber(value);
            break;
          case 'operator':
            handleOperator(value);
            break;
          case 'decimal':
            handleDecimal();
            break;
          case 'calculate':
            calculate();
            break;
          case 'clear':
            clear();
            break;
          case 'backspace':
            backspace();
            break;
        }
      });
    });
    
    function handleNumber(num) {
      if (shouldResetDisplay) {
        currentInput = num;
        shouldResetDisplay = false;
      } else {
        currentInput = currentInput === '0' ? num : currentInput + num;
      }
      updateDisplay();
    }
    
    function handleDecimal() {
      if (shouldResetDisplay) {
        currentInput = '0.';
        shouldResetDisplay = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    }
    
    function handleOperator(op) {
      if (operation && !shouldResetDisplay) {
        calculate();
      }
      
      previousInput = currentInput;
      operation = op;
      shouldResetDisplay = true;
      
      const operatorSymbol = {
        '+': '+',
        '-': '−',
        '*': '×',
        '/': '÷',
        '%': '%'
      }[op];
      
      displayExpression.textContent = `${previousInput} ${operatorSymbol}`;
    }
    
    function calculate() {
      if (!operation || shouldResetDisplay) return;
      
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      let result;
      
      switch (operation) {
        case '+':
          result = prev + current;
          break;
        case '-':
          result = prev - current;
          break;
        case '*':
          result = prev * current;
          break;
        case '/':
          result = current === 0 ? 'Ошибка' : prev / current;
          break;
        case '%':
          result = prev % current;
          break;
      }
      
      if (result === 'Ошибка') {
        currentInput = 'Ошибка';
      } else {
        currentInput = String(Math.round(result * 100000000) / 100000000);
      }
      
      operation = null;
      previousInput = '';
      shouldResetDisplay = true;
      displayExpression.textContent = '';
      updateDisplay();
    }
    
    function clear() {
      currentInput = '0';
      previousInput = '';
      operation = null;
      shouldResetDisplay = false;
      displayExpression.textContent = '';
      updateDisplay();
    }
    
    function backspace() {
      if (shouldResetDisplay || currentInput === 'Ошибка') {
        clear();
        return;
      }
      
      currentInput = currentInput.slice(0, -1) || '0';
      updateDisplay();
    }
    
    function updateDisplay() {
      displayResult.textContent = currentInput;
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
      else if (e.key === '.') handleDecimal();
      else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/' || e.key === '%') handleOperator(e.key);
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clear();
      else if (e.key === 'Backspace') backspace();
    });
  </script>
</body>
</html>
