<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таймер Помодоро</title>
  
  <script type="application/json" id="manifest">
  {
    "id": "pomodoro",
    "name": "Таймер Помодоро",
    "icon": "🍅",
    "description": "Фокусировка на задачах по методу Помодоро"
  }
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    
    .timer-display {
      font-size: 72px;
      font-weight: bold;
      color: #667eea;
      margin: 30px 0;
      font-variant-numeric: tabular-nums;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      background: #e0e0e0;
      color: #333;
    }
    
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .stats {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
    }
    
    .stats p {
      color: #666;
      font-size: 16px;
    }
    
    .stats span {
      color: #667eea;
      font-weight: bold;
      font-size: 20px;
    }
    
    .mode-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .mode-btn {
      padding: 10px 20px;
      border: 2px solid #667eea;
      border-radius: 10px;
      background: white;
      color: #667eea;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }
    
    .mode-btn.active {
      background: #667eea;
      color: white;
    }
    
    .mode-btn:hover {
      transform: translateY(-2px);
    }
    
    @media (max-width: 480px) {
      .timer-display {
        font-size: 56px;
      }
      
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍅 Помодоро</h1>
    <div class="timer-display" id="timer">25:00</div>
    <div class="controls">
      <button id="start-btn" class="btn btn-primary">Старт</button>
      <button id="pause-btn" class="btn" disabled>Пауза</button>
      <button id="reset-btn" class="btn">Сброс</button>
    </div>
    <div class="stats">
      <p>Выполнено циклов: <span id="cycles">0</span></p>
    </div>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="work">Работа (25 мин)</button>
      <button class="mode-btn" data-mode="break">Перерыв (5 мин)</button>
    </div>
  </div>
  
  <script>
    let timeLeft = 25 * 60;
    let isRunning = false;
    let intervalId = null;
    let cycles = parseInt(localStorage.getItem('pomodoroCycles') || '0');
    let currentMode = 'work';
    
    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');
    const cyclesDisplay = document.getElementById('cycles');
    const modeButtons = document.querySelectorAll('.mode-btn');
    
    cyclesDisplay.textContent = cycles;
    updateTimerDisplay();
    
    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
    
    function startTimer() {
      if (isRunning) return;
      
      isRunning = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      
      intervalId = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        
        if (timeLeft <= 0) {
          clearInterval(intervalId);
          isRunning = false;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          
          if (currentMode === 'work') {
            cycles++;
            localStorage.setItem('pomodoroCycles', cycles);
            cyclesDisplay.textContent = cycles;
            alert('🎉 Работа завершена! Время перерыва.');
          } else {
            alert('⏰ Перерыв окончен! Время работать.');
          }
          
          resetTimer();
        }
      }, 1000);
    }
    
    function pauseTimer() {
      if (!isRunning) return;
      
      isRunning = false;
      clearInterval(intervalId);
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }
    
    function resetTimer() {
      pauseTimer();
      timeLeft = currentMode === 'work' ? 25 * 60 : 5 * 60;
      updateTimerDisplay();
    }
    
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        resetTimer();
      });
    });
    
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);
  </script>
</body>
</html>
